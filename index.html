<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Montserrat', sans-serif; }
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #222; }
        h1 { font-weight: 600; letter-spacing: 5px; font-size: 2.5rem; color: #fff; }
        p.subtitle { font-weight: 300; color: #888; margin-top: 10px; font-size: 1rem; letter-spacing: 2px; }
        
        /* Menu des Catégories */
        nav { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #444; color: #aaa; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .filter-btn:hover, .filter-btn.active { border-color: #fff; color: #fff; background-color: #161616; }

        /* Grille de la Galerie */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 8px; background-color: #161616; aspect-ratio: 1 / 1; border: 1px solid #222; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .gallery-item:hover img { transform: scale(1.05); }
        .item-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); opacity: 0; transition: opacity 0.3s; }
        .gallery-item:hover .item-info { opacity: 1; }
        .item-info h3 { font-size: 1rem; font-weight: 400; }

        footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.8rem; border-top: 1px solid #222; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>ED</h1>
        <p class="subtitle">PORTFOLIO D'ILLUSTRATION & FANTASY</p>
        
        <nav>
            <button class="filter-btn active">Tout</button>
            <button class="filter-btn">Concept Art & Fantasy</button>
            <button class="filter-btn">Portraits & Fan-Arts</button>
            <button class="filter-btn">Illustration & Édition</button>
            <button class="filter-btn">Croquis</button>
        </nav>
    <header>
        <h1>ED</h1>
        <p class="subtitle">« Dessine-moi... » — Portfolio d'Illustration</p>
    </header>

    <main class="gallery">
        <!-- Les dessins de Lilou s'afficheront ici après l'envoi des images -->
        <div class="gallery-item">
            <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#555; padding:20px; text-align:center; font-style:italic;">
                [ Écrin activé avec succès ! Prochaine étape : envoyer les illustrations de Lilou ]
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ED. Tous droits réservés. Hébergé gratuitement sur GitHub Pages.</p>
    </footer>

</body>
</html>
