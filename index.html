<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
       body { background-color: #0c0c0e; background-image: radial-gradient(at 20% 20%, #151419 0px, transparent 50%), radial-gradient(at 80% 40%, #111115 0px, transparent 50%), radial-gradient(at 40% 80%, #08080a 0px, transparent 50%); color: #ffffff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        header { padding: 60px 20px 20px 20px; text-align: center; }
        h1 { font-weight: 600; letter-spacing: 8px; font-size: 3rem; color: #fff; }
        p.subtitle { font-weight: 300; color: #666; margin-top: 15px; font-size: 1.1rem; letter-spacing: 3px; font-style: italic; }
        
        /* Menu des Catégories */
        nav { display: flex; justify-content: center; gap: 15px; margin: 40px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #222; color: #555; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.3s; font-size: 0.85rem; }
        .filter-btn:hover, .filter-btn.active { border-color: #fff; color: #fff; background-color: #ffffff0a; }

        /* Grille de la Galerie Épurée */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 4px; background-color: #121212; border: 1px solid #1a1a1a; cursor: pointer; transition: all 0.4s ease; }
        
        /* Image visible à 100% tout le temps */
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
        
        /* Effet au survol doux (comme DouDream) */
        .gallery-item:hover { border-color: #666; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .gallery-item:hover img { transform: scale(1.03); }
        
        /* Système pour agrandir au clic (Lightbox) */
        .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 5, 0.95); justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border: 1px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: 300; cursor: pointer; }

        footer { text-align: center; padding: 60px 20px; color: #222; font-size: 0.8rem; margin-top: 80px; }
    </style>
</head>
<body>

    <header>
        <h1>ED</h1>
        <p class="subtitle">« Dessine-moi... »</p>
        
        <nav>
            <button class="filter-btn active">Tout</button>
            <button class="filter-btn">Concept Art & Fantasy</button>
            <button class="filter-btn">Portraits & Fan-Arts</button>
            <button class="filter-btn">Illustration & Édition</button>
            <button class="filter-btn">Croquis</button>
        </nav>
    </header>

    <main class="gallery">
        <!-- DESSIN 1 -->
        <div class="gallery-item" onclick="openLightbox('crossover1.jpg')">
            <img src="crossover1.jpg" alt="Dessin ED">
        </div>
    </main>

    <!-- Fenêtre pour l'agrandissement au clic -->
    <div id="customLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="" alt="Agrandissement">
    </div>

    <footer>
        <p>&copy; 2026 ED. Tous droits réservés.</p>
    </footer>

    <script>
        function openLightbox(imageSrc) {
            document.getElementById('lightboxImg').src = imageSrc;
            document.getElementById('customLightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('customLightbox').style.display = 'none';
        }
    </script>

</body>
</html>
