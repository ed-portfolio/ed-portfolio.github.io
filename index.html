<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        
        header { padding: 60px 20px 40px 20px; text-align: center; }
        h1 { font-weight: 600; letter-spacing: 8px; font-size: 3rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.1); }
        p.subtitle { font-weight: 300; color: #888; margin-top: 15px; font-size: 1.1rem; letter-spacing: 3px; font-style: italic; }
        
        /* Menu des Catégories */
        nav { display: flex; justify-content: center; gap: 15px; margin: 40px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #222; color: #666; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.4s ease; font-size: 0.85rem; letter-spacing: 1px; }
        .filter-btn:hover, .filter-btn.active { border-color: #fff; color: #fff; background-color: #ffffff0a; box-shadow: 0 0 15px rgba(255,255,255,0.1); }

        /* Grille de la Galerie Évoluée */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 6px; background-color: #121212; aspect-ratio: 4 / 3; border: 1px solid #1a1a1a; cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); filter: brightness(0.6) grayscale(0.2); }
        
        /* L'effet d'illumination et de zoom au survol de la souris comme DouDream */
        .gallery-item:hover { transform: translateY(-4px) scale(1.02); filter: brightness(1.1) grayscale(0); border-color: #444; box-shadow: 0 10px 30px rgba(255, 255, 255, 0.08); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); opacity: 0; transition: opacity 0.3s ease; }
        .gallery-item:hover .item-info { opacity: 1; }
        .item-info h3 { font-size: 0.95rem; font-weight: 400; letter-spacing: 1px; }

        footer { text-align: center; padding: 60px 20px; color: #333; font-size: 0.8rem; letter-spacing: 1px; margin-top: 80px; }
    </style>
</head>
<body>

    <header>
        <h1>ED</h1>
        <p class="subtitle">« Dessine-moi... »</p>
        
        <nav>
            <button class="filter-btn active">Tout</button>
            <button class="filter-btn">Concept Art & Fantasy</button>
            <button class="filter-btn">Portraits & Fan-Arts</button>
            <button class="filter-btn">Illustration & Édition</button>
            <button class="filter-btn">Croquis</button>
        </nav>
    </header>

    <main class="gallery">
        <!-- LE PREMIER DESSIN APPARAÎTRA ICI -->
        <div class="gallery-item">
            <!-- Nous remplacerons "dessin1.jpg" par le vrai nom de son fichier juste après -->
            <img src="dessin1.jpg" alt="Illustration ED">
            <div class="item-info">
                   <div class="gallery-item">
            <img src="crossover1.jpg" alt="Cross-over Le Petit Prince x Tim Burton">
            <div class="item-info">
                <h3>Projet d'études : Le Petit Prince x Tim Burton</h3>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ED. Tous droits réservés.</p>
    </footer>

</body>
</html>
