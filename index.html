<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0b0b0d; 
            background-image: 
                radial-gradient(at 10% 20%, #15141a 0px, transparent 50%), 
                radial-gradient(at 90% 10%, #100f13 0px, transparent 50%), 
                radial-gradient(at 50% 80%, #070709 0px, transparent 60%);
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }

        /* MENU DE NAVIGATION EN HAUT FIXE */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            z-index: 1000;
            background-color: rgba(11, 11, 13, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #ecd7be;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        .insta-icon { color: #d8a26b !important; font-weight: 500; }

        /* ACCUEIL PLEIN ÉCRAN ACCUEILLANT */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px 20px 20px;
            position: relative;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid #333;
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            animation: fadeInSlow 2s ease forwards;
        }
        
        .hero-tag {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 1.2s ease forwards;
        }

        .hero h1 { 
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400; 
            letter-spacing: 8px; 
            font-size: 5.5rem; 
            color: #ecd7be; 
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.3s forwards; 
        }
        
        .hero p.subtitle-prince { 
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400; 
            color: #888; 
            margin-top: 15px; 
            font-size: 1.4rem; 
            letter-spacing: 2px; 
            font-style: italic; 
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.6s forwards; 
        }

        /* BLOC DES STATISTIQUES MODIFIÉ */
        .stats-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 35px 0 25px 0;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.9s forwards;
            width: 100%;
            max-width: 450px;
        }
        .stats-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 70px;
            width: 100%;
            padding-bottom: 20px;
        }
        /* FINE LIGNE HORIZONTALE EN DESSOUS DES CHIFFRES */
        .stats-hr {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.08), transparent);
            border: none;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: #ecd7be;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
        }

        /* PHRASE DE PRÉSENTATION */
        .hero p.subtitle-long {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            color: #777;
            font-size: 0.95rem;
            letter-spacing: 1px;
            max-width: 550px;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 35px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 1.1s forwards;
        }

        /* BOUTON OVALE COLORÉ */
        .hero-btn {
            background-color: #d8a26b;
            color: #111;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(216, 162, 107, 0.15);
            opacity: 0;
            animation: fadeInUp 1.2s ease 1.3s forwards;
        }
        .hero-btn:hover {
            background-color: #ecd7be;
            transform: translateY(-2px);
        }
        
        /* LAYOUT SECTIONS */
        .content-section { padding: 100px 20px 40px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 400; text-align: center; letter-spacing: 4px; color: #ecd7be; margin-bottom: 40px; }

        /* Menu Galerie */
        nav.gallery-nav { display: flex; justify-content: center; gap: 15px; margin: 20px 0 40px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #1a1a22; color: #444; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.4s ease; font-size: 0.85rem; letter-spacing: 1px; }
        .filter-btn:hover, .filter-btn.active { border-color: #888; color: #fff; background-color: #ffffff04; }

        /* Grille Pinterest */
        .gallery { column-count: 3; column-gap: 30px; }
        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 600px) { .gallery { column-count: 1; } }
        
        .gallery-item { 
            break-inside: avoid; margin-bottom: 30px; position: relative; overflow: hidden; 
            border-radius: 4px; background-color: #101013; border: 1px solid #141418; cursor: pointer; transition: all 0.4s ease;
        }
        .gallery-item img { width: 100%; height: auto; display: block; transition: transform 0.6s ease; }
        .gallery-item:hover { border-color: #555; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .gallery-item:hover img { transform: scale(1.02); }
        
        /* Section À propos */
        .about-box { max-width: 700px; margin: 0 auto; text-align: center; line-height: 1.8; color: #aaa; font-weight: 300; font-size: 1rem; }
        .about-box strong { color: #ecd7be; font-weight: 500; display: block; margin-bottom: 10px; font-size: 1.2rem; font-family: 'Cormorant Garamond', serif; letter-spacing: 1px; }

        /* Section Contact */
        .contact-box { max-width: 600px; margin: 0 auto; text-align: center; }
        .mail-link { display: inline-block; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #d8a26b; text-decoration: none; margin-top: 10px; transition: color 0.3s; letter-spacing: 1px; }
        .mail-link:hover { color: #ecd7be; }

        /* Lightbox */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 7, 0.98); justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border: 1px solid #1a1a22; box-shadow: 0 0 60px rgba(0,0,0,0.9); }
        
        footer { text-align: center; padding: 80px 20px; color: #222; font-size: 0.8rem; border-top: 1px solid #111; margin-top: 60px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInSlow {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- MENUS DU HAUT FIXE PERMANENT -->
    <header class="top-nav">
        <div class="nav-logo" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">ED</div>
        <div class="nav-links">
            <a href="#portfolio-content">Portfolio</a>
            <a href="#about">À propos</a>
            <a href="#contact">Contact</a>
            <a href="https://instagram.com" target="_blank" class="insta-icon">Instagram</a>
        </div>
    </header>

    <!-- ACCUEIL COMPLET -->
    <section class="hero">
        <img class="avatar" src="guerriere.jpg" alt="ED Avatar">
        <div class="hero-tag">Illustrateur & Concept Artist</div>
        <h1>ED</h1>
        <p class="subtitle-prince">« Dessine-moi... »</p>
        
        <!-- COMPTEURS AVEC SEPARATION HORIZONTALE LOGIQUE -->
