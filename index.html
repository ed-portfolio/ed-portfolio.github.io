<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <!-- Chargement des polices : Cormorant Garamond pour le côté mystique/fantasy et Montserrat pour le texte -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0b0b0d; 
            background-image: 
                radial-gradient(at 10% 20%, #15141a 0px, transparent 50%), 
                radial-gradient(at 90% 10%, #100f13 0px, transparent 50%), 
                radial-gradient(at 50% 80%, #070709 0px, transparent 60%);
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }

        /* MENU DE NAVIGATION EN HAUT (Comme DouDream) */
        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            z-index: 100;
        }
        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        .insta-icon {
            color: #d8a26b; /* Couleur dorée discrète pour le bouton Insta */
            font-weight: 500;
        }

        /* ACCUEIL PLEIN ÉCRAN REVISITÉ */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid #333;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            animation: fadeInSlow 2s ease forwards;
        }
        
        .hero-tag {
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #8a8994;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .hero h1 { 
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400; 
            letter-spacing: 8px; 
            font-size: 5.5rem; 
            color: #ecd7be; /* Teinte ivoire/dorée très douce style grimoire */
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.4s forwards; 
        }
        
        .hero p.subtitle { 
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400; 
            color: #888; 
            margin-top: 20px; 
            font-size: 1.4rem; 
            letter-spacing: 2px; 
            font-style: italic; 
            max-width: 600px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeInUp 1.5s ease 0.8s forwards; 
        }

        /* COMPTEURS DE STATISTIQUES */
        .stats-container {
            display: flex;
            gap: 40px;
            margin: 40px 0 30px 0;
            opacity: 0;
            animation: fadeInUp 1.5s ease 1.2s forwards;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: #ecd7be;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
        }

        /* BOUTON DOUDREAM STYLE */
        .hero-btn {
            background-color: #d8a26b;
            color: #111;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(216, 162, 107, 0.2);
            opacity: 0;
            animation: fadeInUp 1.5s ease 1.4s forwards;
        }
        .hero-btn:hover {
            background-color: #ecd7be;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 215, 190, 0.3);
        }
        
        .content-section { padding-top: 60px; max-width: 1200px; margin: 0 auto; }

        /* Menu de la Galerie */
        nav.gallery-nav { display: flex; justify-content: center; gap: 15px; margin: 40px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #1a1a22; color: #444; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.4s ease; font-size: 0.85rem; letter-spacing: 1px; }
        .filter-btn:hover, .filter-btn.active { border-color: #888; color: #fff; background-color: #ffffff04; }

        /* Grille Pinterest */
        .gallery { column-count: 3; column-gap: 30px; padding: 20px; margin-bottom: 60px; }
        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 600px) { .gallery { column-count: 1; } }
        
        .gallery-item { 
            break-inside: avoid; margin-bottom: 30px; position: relative; overflow: hidden; 
            border-radius: 4px; background-color: #101013; border: 1px solid #141418; cursor: pointer; transition: all 0.4s ease;
        }
        .gallery-item img { width: 100%; height: auto; display: block; transition: transform 0.6s ease; }
        .gallery-item:hover { border-color: #555; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .gallery-item:hover img { transform: scale(1.02); }
        
        /* Lightbox */
        .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 7, 0.98); justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border: 1px solid #1a1a22; box-shadow: 0 0 60px rgba(0,0,0,0.9); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: 200; cursor: pointer; }

        footer { text-align: center; padding: 80px 20px; color: #222; font-size: 0.8rem; border-top: 1px solid #111; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInSlow {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- MENUS DE NAVIGATION SUPÉRIEUR -->
    <header class="top-nav">
        <a href="#" class="nav-logo">ED</a>
        <div class="nav-links">
            <a href="#portfolio-content">Portfolio</a>
            <a href="#about">À propos</a>
            <a href="#contact">Contact</a>
            <a href="https://instagram.com" target="_blank" class="insta-icon">Instagram</a>
        </div>
    </header>

    <!-- SECTION HERO REVISITÉE -->
    <section class="hero">
        <img class="avatar" src="guerriere.jpg" alt="ED Avatar">
        <div class="hero-tag">Artiste Illustratrice</div>
        <h1>ED</h1>
        <p class="subtitle">« Dessine-moi... »<br>Chaque illustration est un voyage au cœur de l'imaginaire.</p>
        
        <!-- LES STATISTIQUES ARTISTIQUES -->
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-number">4</div>
                <div class="stat-label">Œuvres</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">2</div>
                <div class="stat-label">Univers</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">2026</div>
                <div class="stat-label">En cours</div>
            </div>
        </div>

        <button class="hero-btn" onclick="scrollToGallery()">Découvrir le portfolio ↓</button>
    </section>

    <!-- SECTION GALERIE -->
    <section id="portfolio-content" class="content-section">
        <nav class="gallery-nav">
            <button class="filter-btn active" onclick="filterGallery('tout', this)">Tout</button>
            <button class="filter-btn" onclick="filterGallery('contes', this)">Contes & Légendes</button>
            <button class="filter-btn" onclick="filterGallery('portraits', this)">Portraits d'Âmes</button>
            <button class="filter-btn" onclick="filterGallery('creatures', this)">Créatures & Fantasy</button>
            <button class="filter-btn" onclick="filterGallery('croquis', this)">Recherches & Ombres</button>
        </nav>

        <main class="gallery">
            <div class="gallery-item" data-category="contes" onclick="openLightbox('crossover1.jpg')">
                <img src="crossover1.jpg" alt="Dessin ED">
            </div>
            <div class="gallery-item" data-category="contes" onclick="openLightbox('chatelaine.jpg')">
                <img src="chatelaine.jpg" alt="Dessin ED">
            </div>
