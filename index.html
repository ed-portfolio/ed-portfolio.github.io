<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED - Portfolio d'Illustration</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0c0c0e; 
            background-image: 
                radial-gradient(at 10% 20%, #16151a 0px, transparent 50%), 
                radial-gradient(at 90% 10%, #111014 0px, transparent 50%), 
                radial-gradient(at 50% 80%, #08080a 0px, transparent 60%);
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }
        
        /* ACCUEIL PLEIN ÉCRAN */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        
        .hero h1 { font-weight: 600; letter-spacing: 15px; font-size: 4rem; color: #fff; animation: fadeInUp 1.2s ease-out; }
        .hero p.subtitle { font-weight: 200; color: #666; margin-top: 20px; font-size: 1.2rem; letter-spacing: 6px; font-style: italic; animation: fadeInUp 1.5s ease-out; }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #333;
            text-transform: uppercase;
            cursor: pointer;
            animation: bounce 2s infinite;
            transition: color 0.3s;
        }
        .scroll-indicator:hover { color: #888; }
        
        .content-section { padding-top: 40px; max-width: 1200px; margin: 0 auto; }

        /* Menu des Nouvelles Catégories */
        nav { display: flex; justify-content: center; gap: 15px; margin: 40px 0; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #1c1c22; color: #444; padding: 10px 25px; border-radius: 25px; cursor: pointer; transition: all 0.4s ease; font-size: 0.85rem; letter-spacing: 1px; }
        .filter-btn:hover, .filter-btn.active { border-color: #888; color: #fff; background-color: #ffffff04; }

        /* GRILLE STYLE PINTEREST (Respecte les proportions des dessins) */
        .gallery { 
            column-count: 3;
            column-gap: 30px;
            padding: 20px;
            margin-bottom: 60px;
        }
        
        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 600px) { .gallery { column-count: 1; } }
        
        .gallery-item { 
            break-inside: avoid;
            margin-bottom: 30px;
            position: relative; 
            overflow: hidden; 
            border-radius: 4px; 
            background-color: #111114; 
            border: 1px solid #15151a; 
            cursor: pointer; 
            transition: all 0.4s ease;
        }
        
        /* Les images s'adaptent à leur vraie hauteur naturelle */
        .gallery-item img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 0.6s ease; 
        }
        
        .gallery-item:hover { border-color: #666; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .gallery-item:hover img { transform: scale(1.02); }
        
        /* Lightbox */
        .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 7, 0.97); justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border: 1px solid #1a1a22; box-shadow: 0 0 60px rgba(0,0,0,0.9); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: 200; cursor: pointer; }

        footer { text-align: center; padding: 80px 20px; color: #222; font-size: 0.8rem; border-top: 1px solid #111; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>ED</h1>
        <p class="subtitle">« Dessine-moi... »</p>
        <div class="scroll-indicator" onclick="scrollToGallery()">Découvrir le portfolio</div>
    </section>

    <section id="portfolio-content" class="content-section">
        <!-- NOS NOUVELLES CATÉGORIES -->
        <nav>
            <button class="filter-btn active" onclick="filterGallery('tout', this)">Tout</button>
            <button class="filter-btn" onclick="filterGallery('contes', this)">Contes & Légendes</button>
            <button class="filter-btn" onclick="filterGallery('portraits', this)">Portraits d'Âmes</button>
            <button class="filter-btn" onclick="filterGallery('creatures', this)">Créatures & Fantasy</button>
            <button class="filter-btn" onclick="filterGallery('croquis', this)">Recherches & Ombres</button>
        </nav>

        <main class="gallery">
            <!-- DESSIN 1 : Le renard -->
            <div class="gallery-item" data-category="contes" onclick="openLightbox('crossover1.jpg')">
                <img src="crossover1.jpg" alt="Dessin ED">
            </div>

            <!-- DESSIN 2 : La Dame -->
            <div class="gallery-item" data-category="contes" onclick="openLightbox('chatelaine.jpg')">
                <img src="chatelaine.jpg" alt="Dessin ED">
            </div>

            <!-- DESSIN 3 : Le Château -->
            <div class="gallery-item" data-category="contes" onclick="openLightbox('chateau.jpg')">
                <img src="chateau.jpg" alt="Dessin ED">
            </div>
        </main>
    </section>

    <div id="customLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="" alt="Agrandissement">
    </div>

    <footer>
        <p>&copy; 2026 ED. Tous droits réservés.</p>
    </footer>

    <script>
        function scrollToGallery() {
            document.getElementById('portfolio-content').scrollIntoView({ behavior: 'smooth' });
        }

        function openLightbox(imageSrc) {
            document.getElementById('lightboxImg').src = imageSrc;
            document.getElementById('customLightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('customLightbox').style.display = 'none';
        }

        function filterGallery(category, button) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            document.querySelectorAll('.gallery-item').forEach(item => {
                if (category === 'tout' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
